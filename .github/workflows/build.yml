
name: Build Jumpy Bird APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf automake autopoint \
            libtool libtool-bin libltdl-dev \
            pkg-config gettext \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<70" wheel virtualenv
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-ubuntu22-py310-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-ubuntu22-py310-

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JumpyBird-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JumpyBird-Build-Log
          path: build.log
          if-no-files-found: ignore
