
name: Build Jumpy Bird APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        uses: digreatbrian/buildozer-action@v1
        with:
          workdir: .
          buildozer_version: stable
          python_version: '3.11'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jumpy-Bird-APK
          path: bin/*.apk
